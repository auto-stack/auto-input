# Rime dependency schema - AutoIME project terms (PLAN-070 T-03).
# encoding: utf-8
#
# A declared schema dependency is how librime learns to compile a dictionary:
# the deployer prepares the primary translator's dictionary for every schema in
# the dependency list. This schema is never listed in the switcher; it only
# makes autoime_terms.dict.yaml deployable.
#
# PLAN-073 T-02: the dictionary's compiled .prism.bin is built while THIS
# schema is deployed, using this schema's speller algebra. Without the pinyin
# abbreviation algebra below the prism contains only the full syllable
# spellings ("zeng liang bian yi"), so an abbreviation path produced by the
# main schema ("zlby" -> z/l/b/y) finds no term entry at all. Mirroring the
# main schema's algebra keeps the term prism consistent no matter which schema
# the deployer compiles first.
schema:
  schema_id: autoime_terms
  name: AutoIME 术语（依赖）
  version: "0.2.0"
  author:
    - AutoIME
  description: |
    AutoIME 项目术语词库的部署入口（不作为可选方案展示）。

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  max_code_length: 32
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction

engine:
  translators:
    - script_translator

translator:
  dictionary: autoime_terms
  enable_user_dict: false
  enable_sentence: false
