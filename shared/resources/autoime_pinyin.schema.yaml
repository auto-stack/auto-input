# Rime schema - AutoIME default pinyin (PLAN-070 T-03).
# encoding: utf-8
#
# Built on the installed Weasel 0.17.4 (librime 1.13.1) shared data:
#   __include: luna_pinyin.schema:/        general pinyin engine settings
#   dictionary: luna_pinyin                general Chinese characters/words
# AutoIME adds original resources only: project terms, mixed English aliases
# and a user-editable explicit phrase table. No upstream file is modified.
__include: luna_pinyin.schema:/

schema:
  schema_id: autoime_pinyin
  name: AutoInput 拼音
  version: "0.3.1"
  author:
    - AutoIME
  description: |
    离线简体拼音：全拼、简拼、全简混输、项目术语与中英混输。
    通用字词与转换数据复用已安装小狼毫（librime 1.13.1）的共享目录；
    项目术语、英文别名与用户短语由 AutoIME 资源目录提供。
    0.2.0（PLAN-073）：术语依赖方案补齐拼音代数，四字术语的首字母简拼
    （如 zlby/lxpy/hxck）与全简混输进入自然候选前五。
    0.3.0（PLAN-078）：英文别名改为完整码准入，单字母与短前缀不再抢占
    中文首选（`s` 首选「是」），完整码 `sqlite`/`ros`/`autoos` 保持有效。
    0.3.1（PLAN-078）：补充词表 autoime_words 与主拼音共用 autoime_user 学习域，
    确认「是的」这类词时按同一文字与读音写入并跨拼法生效。
  dependencies:
    - autoime_terms
    - autoime_en
    - autoime_words
    - autoime_user_terms

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 1
    states: [ 简体, 繁体 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
    - script_translator@autoime_terms
    - script_translator@autoime_words
    # PLAN-078 T-05: personal English terms (exact, case-sensitive codes) rank
    # before the built-in alias table so a personal entry can override it.
    - table_translator@autoime_user_terms
    - table_translator@autoime_en
  filters:
    - simplifier
    - uniquifier

speller:
  # Digits stay outside the alphabet so they remain page-selection keys;
  # mixed English aliases use letter-only codes (see autoime_en).
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  max_code_length: 32
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction

translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  user_dict: autoime_user
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# Original project terminology (AutoIME resources).
# initial_quality 1.0 (PLAN-073): the term translator now takes part in natural
# abbreviation competition, so its candidates must not sit below ordinary
# sentence candidates for the same keys (0.2 dropped 高斯泼溅 from #1 to #2 for
# "gaosipoj"). Terms have only exact long codes, so the raised quality does not
# affect unrelated short inputs (controls in shared/tests/pinyin-quality.json).
autoime_terms:
  dictionary: autoime_terms
  enable_user_dict: false
  enable_sentence: false
  initial_quality: 1.0

# Shared natural-pinyin word corrections (PLAN-073): ordinary words whose
# preset-vocabulary weight is below their modern usage, e.g. 是的. They take
# part in normal syllable/abbreviation competition.
# PLAN-078 T-04 (AUTOIME-LEARNING-SHARING): this translator now writes to the
# SAME user dictionary as the main pinyin translator (user_dict autoime_user),
# so confirming a supplementary word learns it exactly like an ordinary word,
# under the same text/reading key and visible from every spelling. Before this,
# `enable_user_dict: false` silently dropped those confirmations.
autoime_words:
  dictionary: autoime_words
  enable_user_dict: true
  user_dict: autoime_user
  enable_sentence: false
  initial_quality: 1.0

# Original mixed English/technical aliases (AutoIME resources).
# PLAN-078 T-01 (AUTOIME-EN-TRIGGER): completion is OFF. With completion on,
# the table translator expanded every prefix of the alias codes, so the single
# letter `s` recalled `SQLite` (and `sq`/`sql` recalled it too) and the alias
# outranked the ordinary Chinese candidates. Admission is now exact-code only:
# `sqlite`, `ros`, `autoos`, `tsf` keep working; `s`/`sq`/`sql` stay Chinese.
# Explicit case-sensitive trigger codes (`SQ`, `SQLite`) are delivered by
# T-05 and are not part of this switch.
autoime_en:
  dictionary: autoime_en
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0.1

# User-editable explicit phrases: %APPDATA%\AutoIME\rime\custom_phrase.txt
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  columns:
    - text
    - code
    - weight
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# Personal English terms (PLAN-078 T-05): user-editable table copied into the
# user data dir as autoime_user_terms.dict.yaml by the manager and compiled by
# deployment. Exact, case-sensitive codes only.
autoime_user_terms:
  dictionary: autoime_user_terms
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.0

# Default digit selection labels (1-5 for a five-candidate page); the IME
# always renders the labels reported by the engine.
menu:
  page_size: 5
  alternative_select_keys: "12345"

simplifier:
  option_name: simplification
  opencc_config: t2s.json
  tips: all

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
